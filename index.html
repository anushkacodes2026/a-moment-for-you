<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A Moment For You</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial,sans-serif;background:linear-gradient(145deg,#f8fafc,#e0f2fe,#eef2ff);
color:#172033;padding:22px}
.card{width:min(460px,100%);padding:42px 28px;text-align:center;border-radius:30px;
background:rgba(255,255,255,.78);backdrop-filter:blur(15px);
box-shadow:0 20px 60px rgba(30,41,59,.15);border:1px solid rgba(255,255,255,.9)}
.icon{font-size:48px;margin-bottom:10px}
h1{font-size:31px;margin:0 0 12px;letter-spacing:-.5px}
.intro{font-size:16px;line-height:1.65;color:#5b6475;margin-bottom:27px}
.choices{display:grid;gap:11px}
button{width:100%;border:0;border-radius:15px;padding:15px;font-size:16px;
font-weight:700;cursor:pointer;background:#172033;color:white}
#message{display:none;margin-top:23px;padding:22px;border-radius:20px;
background:#f8fafc;border:1px solid #e2e8f0;font-size:17px;line-height:1.7;color:#334155}
.credit{margin-top:27px;font-size:12px;color:#8a93a3}
</style>
</head>
<body>
<main class="card">
<div class="icon">🌱</div>
<h1>A Moment For You</h1>
<div class="intro">
No matter who you are, where you are, or what you're going through —
take a small moment for yourself.
</div>

<div class="choices">
<button onclick="showMessage('encourage')">🌤️ I need encouragement</button>
<button onclick="showMessage('calm')">🕊️ I need a moment of calm</button>
<button onclick="showMessage('continue')">🌱 I need motivation to continue</button>
</div>

<div id="message"></div>
<div class="credit">A small reminder from Anushka Chavan ✨</div>
</main>

<script>
const messages={
encourage:`You are doing better than you think.<br><br>
You don't have to compare your journey with anyone else's.
Every small effort matters, even when nobody sees it.<br><br>
<strong>Give yourself credit for how far you've come.</strong> 🌤️`,

calm:`Pause for a moment.<br><br>
Take a slow breath in… and let it out.<br><br>
You don't need to solve everything right now.
Give yourself permission to simply be present.<br><br>
<strong>One moment at a time.</strong> 🕊️`,

continue:`You don't need to have everything figured out today.<br><br>
Some days are for achieving. Some are for learning.
Some are simply for taking the next small step.<br><br>
<strong>Keep going at your own pace. Your effort matters.</strong> 🌱`
};

function showMessage(type){
 const m=document.getElementById("message");
 m.innerHTML=messages[type];
 m.style.display="block";
 m.scrollIntoView({behavior:"smooth",block:"nearest"});
}
</script>
</body>
</html>
